{% extends 'admin_dashboard.html' %}

{% block content %}
  <style>
    .form-card {
      width: 100%;
      max-width: 700px;
      margin: 30px auto;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 25px;
      color: white;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }
    .form-control,
    .form-select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
    }
    .form-control::placeholder {
      color: #868686;
    }
    .form-control:focus,
    .form-select:focus {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      box-shadow: none;
      border-color: #474242;
      border: 1px solid !important;
    }
    @media (max-width: 300px) {
      .form-card h3 {
        font-size: 14px;
      }
      .form-label {
        font-size: 10px !important;
      }
      .form-control {
        width: 100%;
      }
      .form-control::placeholder {
        font-size: 10px;
      }
      .btn-primary {
        font-size: 10px;
      }
    }
    @media (max-width: 249px) and (min-width: 170px) {
      .form-card h3 {
        font-size: 10px;
        margin-bottom: 10px !important;
      }
      .form-label {
        font-size: 7px !important;
      }
      .form-control {
        width: 100%;
        height: 20px !important;
        padding-bottom: 12px !important;
        padding-left: 2px !important;
      }
      .form-control::placeholder {
        font-size: 7px;
      }
      .btn-primary {
        font-size: 7px;
      }
    }
    @media (max-width: 250px) {
      .form-control {
        width: 100% !important;
        height: 24px !important;
        font-size: 10px !important;
        padding: 2px 4px !important;
      }
    
      .mb-3 {
        margin-bottom: 8px !important;
      }
    }
    .alert {
      width: 100%;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: normal;
      /*padding-right: 35px !important;*/
    }
    
    {% comment %} .alert .btn-close {
      position: absolute;
      top: 8px;
      right: 8px;
    } {% endcomment %}
    @media (max-width: 340px) and (min-width: 171px) {
      .alert {
        font-size: 10px !important;
        padding: 8px 28px 8px 8px !important;
        line-height: 1.3;
        word-break: break-word;
      }
    
      .alert .btn-close {
        transform: scale(0.7);
        top: 5px;
        right: 5px;
      }
    }
    @media (max-width: 170px) {
      .alert {
        font-size: 6px !important;
        padding: 5px 20px 5px 5px !important;
        line-height: 1.2;
        word-break: keep-all;
        border-radius: 5px !important;
        font-weight: 700;
      }
    
      .alert .btn-close {
        transform: scale(0.45);
        top: 2px;
        right: 2px;
        padding: 2px !important;
      }
    }
    input[type='number']::-webkit-outer-spin-button,
    input[type='number']::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
  <main class="main-content">
    <div class="container mt-4">
      <div class="card shadow p-4 form-card">
        <h3 class="mb-4">Edit Standard</h3>

        <form method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Standard Name: (Existing names not allowed)</label>

            <input type="number" name="standard_name" class="form-control" placeholder="Enter standard number (1-12)" min="1" max="12" maxlength="2" required autocomplete="off" value="{{ standard.standard_name|cut:'STANDARD ' }}" />
          </div>
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{ message }}
                {% comment %} <button type="button" class="btn-close" data-bs-dismiss="alert"></button> {% endcomment %}
              </div>
            {% endfor %}
          {% endif %}

          <button type="submit" class="btn btn-primary">Update Standard</button>
        </form>
      </div>
    </div>
  </main>
  <script>
    setTimeout(() => {
      document.querySelectorAll('.alert').forEach((alert) => {
        bootstrap.Alert.getOrCreateInstance(alert).close()
      })
    }, 3000)
  </script>
{% endblock %}
