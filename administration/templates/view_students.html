{% extends 'admin_dashboard.html' %}

{% block content %}
  <style>
    .main-content {
      padding: 20px;
    }
    
    .form-card {
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 25px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    
    .standard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }
    
    .standard-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      transition: 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .standard-card:hover {
      transform: translateY(-5px);
    }
    
    .standard-name {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .student-count {
      font-size: 2rem;
      font-weight: bold;
      color: #ffc107;
      margin-bottom: 15px;
    }
    
    .view-btn {
      border-radius: 12px;
      padding: 8px 18px;
      font-weight: 500;
    }
    
  @media (max-width: 991px) {
  .main-content {
    padding: 15px;
  }

  .form-card {
    padding: 20px;
  }

  .standard-grid {
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
  }
}

@media (max-width: 768px) {
  .form-card {
    padding: 15px;
  }

  .standard-grid {
    grid-template-columns: 1fr;
    gap: 15px;
  }

  .standard-card {
    padding: 15px;
  }

  .student-count {
    font-size: 1.8rem;
  }

  .view-btn {
    width: 100%;
  }
}

@media (max-width: 576px) {
  .main-content {
    padding: 10px;
  }

  .form-card {
    padding: 12px;
  }

  .standard-card {
    padding: 12px;
  }

  .standard-name {
    font-size: 1rem;
  }

  .student-count {
    font-size: 1.5rem;
  }

  .view-btn {
    width: 100%;
    font-size: 14px;
  }
}

@media (max-width: 320px) {
  .form-card {
    padding: 10px;
    border-radius: 15px;
  }

  .standard-card {
    padding: 10px;
    border-radius: 12px;
  }

  .standard-name {
    font-size: 0.9rem;
  }

  .student-count {
    font-size: 1.2rem;
  }

  .view-btn {
    font-size: 12px;
    padding: 6px 10px;
  }

  h2 {
    font-size: 1rem;
  }
}

@media (max-width: 200px) {
  .main-content {
    padding: 4px;
  }

  .form-card {
    padding: 6px;
    border-radius: 8px;
  }

  .standard-grid {
    gap: 6px;
  }

  .standard-card {
    padding: 6px;
    border-radius: 8px;
  }

  .standard-name {
    font-size: 0.65rem;
    margin-bottom: 4px;
  }

  .student-count {
    font-size: 0.9rem;
    margin-bottom: 4px;
  }

  .standard-card p {
    font-size: 7px;
    margin-bottom: 4px;
  }

  .view-btn {
    width: 100%;
    font-size: 7px;
    padding: 4px;
  }

  h2 {
    font-size: 0.8rem;
  }

  hr {
    margin: 8px 0;
  }
}

@media (max-width: 170px) {
  .main-content {
    padding: 2px;
  }

  .form-card {
    padding: 4px;
    border-radius: 5px;
  }

  .standard-grid {
    gap: 4px;
    margin-top: 8px;
  }

  .standard-card {
    padding: 4px;
    border-radius: 5px;
  }

  .standard-name {
    font-size: 0.5rem;
    margin-bottom: 2px;
  }

  .student-count {
    font-size: 0.7rem;
    margin-bottom: 2px;
  }

  .standard-card p {
    font-size: 5px;
    margin-bottom: 2px;
  }

  .view-btn {
    width: 100%;
    font-size: 5px;
    padding: 2px;
    border-radius: 4px;
  }

  h2 {
    font-size: 0.6rem;
  }

  .bi {
    display: none;
  }

  hr {
    margin: 5px 0;
  }
}
  </style>

  <div class="main-content">
    <div class="container-fluid">
      <div class="form-card">
        <h2 class="text-center">
          <i class="bi bi-people-fill"></i>
          View Students
        </h2>

        <hr />

        <div class="standard-grid">
          {% for item in standard_data %}
            <div class="standard-card">
              <div class="standard-name">{{ item.standard.standard_name }}</div>

              <div class="student-count">{{ item.count }}</div>

              <p>Total Students</p>

              <a href="{% url 'view_students_by_standard' item.standard.standard_name %}" class="btn btn-primary view-btn">View Students</a>
            </div>
          {% empty %}
            <div class="text-center">
              <h5>No Standards Found</h5>
            </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
{% endblock %}
