{% extends 'student_dashboard.html' %}

{% block content %}
  <div class="welcome-card">
    <h2>Student Profile</h2>

    <hr />

    <div class="row">
      <div class="col-lg-3 text-center mb-4">
        <img src="https://via.placeholder.com/180" class="img-fluid rounded-circle border border-3 border-light" />
      </div>

      <div class="col-lg-9">
        <div class="row">
          <div class="col-md-6 mb-3">
            <strong>Name :</strong>
            {{ student.name }}
          </div>

          <div class="col-md-6 mb-3">
            <strong>Roll Number :</strong>
            {{ student.roll_number }}
          </div>

          <div class="col-md-6 mb-3">
            <strong>Standard :</strong>
            {{ student.standard }}
          </div>

          <div class="col-md-6 mb-3">
            <strong>Phone :</strong>
            {{ student.phone }}
          </div>

          <div class="col-md-6 mb-3">
            <strong>Email :</strong>
            {{ student.email }}
          </div>

          <div class="col-md-6 mb-3">
            <strong>Teacher :</strong>
            {{ student.teacher.name }}
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
