{% extends 'admin_dashboard.html' %}

{% block content %}
  <style>
    .form-card {
      width: 100%;
      max-width: 700px;
      margin: 30px auto;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 25px;
      color: white;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }
    .form-control,
    .form-select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
    }
    .form-control::placeholder {
      color: #868686;
    }
    .form-control:focus,
    .form-select:focus {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      box-shadow: none;
      border-color: #474242;
      border: 1px solid !important;
    }
    @media (max-width: 300px) {
      .form-card h3 {
        font-size: 14px;
      }
      .form-label {
        font-size: 10px !important;
      }
      .form-control {
        width: 100%;
      }
      .form-control::placeholder {
        font-size: 10px;
      }
      .btn-primary {
        font-size: 10px;
      }
    }
    @media (max-width: 249px) and (min-width: 170px) {
      .form-card h3 {
        font-size: 10px;
        margin-bottom: 10px !important;
      }
      .form-label {
        font-size: 7px !important;
      }
      .form-control {
        width: 100%;
        height: 20px !important;
        padding-bottom: 12px !important;
        padding-left: 2px !important;
      }
      .form-control::placeholder {
        font-size: 7px;
      }
      .btn-primary {
        font-size: 7px;
      }
    }
    @media (max-width: 250px) {
      .form-control {
        width: 100% !important;
        height: 24px !important;
        font-size: 10px !important;
        padding: 2px 4px !important;
      }
    
      .mb-3 {
        margin-bottom: 8px !important;
      }
    }
    .alert {
      width: 100%;
      word-break: keep-all;
      overflow-wrap: break-word;
      white-space: normal;
      /* padding-right: 20 px !important;*/
    }
    
    .alert .btn-close {
      position: absolute;
      top: 8px;
      right: -4px;
    }
    @media (max-width: 340px) {
      .form-card {
        padding: 12px !important;
        margin: 10px auto !important;
        border-radius: 12px !important;
      }
    
      .container {
        padding-left: 5px !important;
        padding-right: 5px !important;
      }
    
      .card {
        width: 100% !important;
      }
    
      .btn-primary {
        width: 100% !important;
      }
    }
    @media (max-width: 250px) {
      .form-card {
        padding: 6px !important;
      }
    
      .form-control {
        height: 24px !important;
        font-size: 8px !important;
      }
    
      .form-label {
        font-size: 7px !important;
      }
    
      .btn-primary {
        width: 100% !important;
        font-size: 7px !important;
        padding: 2px !important;
      }
    
      .alert {
        width: 100% !important;
        margin-bottom: 5px !important;
        font-size: 6px !important;
        font-weight: 700;
      }
    }
    @media (max-width: 170px) {
      .container {
        padding: 2px !important;
      }
    
      .form-card {
        padding: 4px !important;
      }
    
      .form-control {
        font-size: 7px !important;
        height: 20px !important;
      }
    
      .btn-primary {
        font-size: 6px !important;
      }
    }
    @media (max-width: 475px) {
      input::placeholder {
        font-size: 10px;
      }
      input {
        padding-bottom: 10px !important;
      }
    }
    input[type='number']::-webkit-outer-spin-button,
    input[type='number']::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
  <main class="main-content">
    <div class="container mt-4">
      <div class="card shadow p-4 form-card">
        <h3 class="mb-4">Add Standard</h3>

        <form method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Standard Name</label>

            <input type="number" name="standard_name" class="form-control" placeholder="Enter standard (1-12)" min="1" max="12" required maxlength="2" />
          </div>
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{ message }}
                {% comment %} <button type="button" class="btn-close" data-bs-dismiss="alert"></button> {% endcomment %}
              </div>
            {% endfor %}
          {% endif %}

          <button type="submit" class="btn btn-primary d-block mx-auto">Add Standard</button>
        </form>
      </div>
    </div>
  </main>
  <script>
    setTimeout(() => {
      document.querySelectorAll('.alert').forEach((alert) => {
        bootstrap.Alert.getOrCreateInstance(alert).close()
      })
    }, 3000)
  </script>
{% endblock %}
