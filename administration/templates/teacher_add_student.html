{% extends 'teacher_dashboard.html' %}

{% block content %}
  <style>
    .form-card {
      width: 100%;
      max-width: 700px;
      margin: 30px auto;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(15px);
      padding: 30px;
      border-radius: 25px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    
    .form-card label {
      color: #f5f5f5;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 8px;
      display: block;
    }
    
    .form-control {
      width: 100%;
      height: 52px;
      background: rgba(15, 23, 20, 0.9);
      color: #fff;
      border: 1px solid rgba(40, 167, 69, 0.35);
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    
    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    
    .form-control:focus {
      background: rgba(15, 23, 20, 0.95);
      color: #fff;
      border-color: #28a745;
      box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
    }
    
    .form-control[readonly] {
      background: rgba(20, 30, 25, 0.95);
      color: #fff;
      border: 1px solid rgba(40, 167, 69, 0.4);
    }
    
    .btn-success {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 600;
    }
    
    .text-danger {
      display: block;
      margin-top: 4px;
      font-size: 14px;
    }
    
    /* Responsive adjustments */
    @media (max-width: 992px) {
      .form-card {
        max-width: 100%;
        margin: 20px auto;
        padding: 25px;
      }
    }
    
    @media (max-width: 768px) {
      .form-card {
        margin: 15px auto;
        padding: 20px;
        border-radius: 20px;
      }
      .form-card h2 {
        font-size: 28px;
      }
      .form-control {
        height: 48px;
        font-size: 15px;
      }
      .btn-success {
        height: 48px;
        font-size: 17px;
      }
    }
    
    @media (max-width: 480px) {
      .form-card {
        margin: 10px auto;
        padding: 18px;
        border-radius: 16px;
      }
      .form-card h2 {
        font-size: 24px;
      }
      .form-control {
        height: 46px;
        font-size: 14px;
      }
      .btn-success {
        height: 46px;
        font-size: 16px;
      }
    }
    
    @media (max-width: 300px) {
      .form-card {
        padding: 12px;
        border-radius: 12px;
      }
      .form-card h2 {
        font-size: 17 px;
      }
    }
    @media (max-width: 200px) {
      .main-content {
        padding: 5px !important;
        margin: 0 !important;
      }
    
      .top-heading {
        font-size: 13px !important;
        text-align: center;
        margin-bottom: 10px !important;
        word-break: break-word;
      }
    
      .form-card {
        width: 100% !important;
        padding: 8px !important;
        margin: 5px auto !important;
        border-radius: 8px !important;
      }
    
      .form-card h2,
      .add-student {
        font-size: 12px !important;
        margin-bottom: 10px !important;
        line-height: 1.3;
        word-break: break-word;
      }
    
      .form-card h2 i {
        display: none;
      }
    
      .form-card label {
        font-size: 10px !important;
        margin-bottom: 3px;
      }
    
      .form-control {
        height: 30px !important;
        font-size: 10px !important;
        padding: 4px 6px !important;
        border-radius: 6px !important;
      }
    
      .btn-success {
        height: 32px !important;
        font-size: 11px !important;
        border-radius: 6px !important;
      }
    
      .text-danger {
        font-size: 9px !important;
      }
    
      .alert {
        font-size: 10px !important;
        padding: 5px !important;
      }
    
      .row {
        margin: 0 !important;
      }
    
      .col-md-6 {
        padding: 0 !important;
        width: 100% !important;
        flex: 0 0 100% !important;
        max-width: 100% !important;
      }
    }
    
    @media (max-width: 170px) {
      .top-heading {
        font-size: 11px !important;
      }
    
      .form-card h2,
      .add-student {
        font-size: 10px !important;
      }
    
      .form-card label {
        font-size: 8px !important;
      }
    
      .form-control {
        height: 26px !important;
        font-size: 8px !important;
        padding: 2px 4px !important;
      }
    
      .btn-success {
        height: 28px !important;
        font-size: 9px !important;
      }
    
      .text-danger {
        font-size: 7px !important;
      }
    }
  </style>

  <div class="main-content">
    <h1 class="top-heading mb-4">Add Student</h1>
    <div class="form-card">
      <h2 class="text-center add-student mb-4"><i class="fas fa-user-plus"></i>Add Student</h2>
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-warning">{{ message }}</div>
        {% endfor %}
      {% endif %}
      <form method="POST" id="addStudentForm">
        {% csrf_token %}

        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Assigned Standard</label>
            <input type="text" class="form-control" value="{{ teacher.standard }}" readonly />
          </div>
          <div class="col-md-6 mb-3">
            <label>Class Teacher</label>
            <input type="text" class="form-control" value="{{ teacher.name }}" readonly />
          </div>

          <div class="col-md-6 mb-3">
            <label>Student Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter student full name" value="{{ name|default:'' }}" required />
            <small class="text-danger" id="nameError"></small>
          </div>

          <div class="col-md-6 mb-3">
            <label>Roll Number</label>
            <input type="text" class="form-control" value="{{ roll_number }}" readonly />
          </div>

          <div class="col-md-6 mb-3">
            <label>Phone Number</label>
            <input type="text" id="phone" name="phone" class="form-control" placeholder="Enter 10-digit phone number" value="{{ phone|default:'' }}" maxlength="10" required />
            <small class="text-danger" id="phoneError"></small>
          </div>

          <div class="col-md-6 mb-3">
            <label>Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter Gmail address" value="{{ email|default:'' }}" required />
            <small class="text-danger" id="emailError"></small>
          </div>
        </div>

        <button type="submit" class="btn btn-success mt-3">Add Student</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('addStudentForm').addEventListener('submit', function (e) {
      let isValid = true
    
      const nameField = document.getElementById('name')
      const phoneField = document.getElementById('phone')
      const emailField = document.getElementById('email')
    
      const nameError = document.getElementById('nameError')
      const phoneError = document.getElementById('phoneError')
      const emailError = document.getElementById('emailError')
    
      // Clear previous errors
      nameError.textContent = ''
      phoneError.textContent = ''
      emailError.textContent = ''
    
      const name = nameField.value.trim()
      const phone = phoneField.value.trim()
      const email = emailField.value.trim()
    
      // Name validation
      if (name === '') {
        nameError.textContent = 'Student name is required'
        isValid = false
      } else if (!/^[A-Za-z\s]{3,25}$/.test(name)) {
        nameError.textContent = 'Only letters allowed (3-25 characters)'
        isValid = false
      }
    
      // Phone validation
      if (phone === '') {
        phoneError.textContent = 'Phone number is required'
        isValid = false
      } else if (!/^[6-9]\d{9}$/.test(phone)) {
        phoneError.textContent = 'Enter valid 10 digit phone number starting with 6-9'
        isValid = false
      }
    
      // Email validation
      if (email === '') {
        emailError.textContent = 'Email is required'
        isValid = false
      } else if (!/^[a-zA-Z0-9_.]+@gmail\.com$/.test(email)) {
        emailError.textContent = 'Only Gmail addresses are allowed'
        isValid = false
      }
    
      if (!isValid) {
        e.preventDefault()
      }
    })
  </script>
  <script>
    setTimeout(() => {
      document.querySelectorAll('.alert').forEach((alert) => {
        alert.style.transition = 'opacity 0.5s ease'
        alert.style.opacity = '0'
    
        setTimeout(() => {
          alert.remove()
        }, 500)
      })
    }, 3000)
  </script>
{% endblock %}
